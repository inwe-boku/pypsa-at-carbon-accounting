# Minimal, fast-running PyPSA-AT configuration as a common base for comparing
# carbon accounting methods and design choices. Layered on top of the default
# stack via:
#
#   pixi run snakemake -call --configfile config/config.carbon-accounting.yaml
#
# Only the keys below differ from config/config.at.yaml. Target: every solve
# finishes in under 30 minutes.

run:
  prefix: carbon-accounting
  name:
  - CA_base
  scenarios:
    enable: true
    file: config/scenarios.carbon-accounting.yaml

# The smallest clustering supported by mods.clustering.custom is AT10DE5:
# Austria at NUTS2 (10 regions) and Germany in 5 macro-regions. AT/DE at
# level 0 is not available. All other countries are one node each; the
# island splits of IT, DK and GB are dropped.
clustering:
  administrative:
    AT: 2
    DE: 3
    DK: 0
    GB: 0
    IT: 0

mods:
  modify_nuts3_shapes: AT10DE5

solving:
  solver:
    name: gurobi
    options: gurobi-default
